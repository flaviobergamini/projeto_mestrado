name: Build and Test

# Executa em todas as branches quando houver push ou pull request
on:
  push:
    branches:
      - '**'  # Todas as branches
  pull_request:
    branches:
      - '**'  # Todas as branches

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check Python syntax
      run: |
        # Instala flake8 para verificar sintaxe
        pip install flake8
        # Para a execução se houver erros de sintaxe
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,__pycache__,.git

    - name: Verify project imports
      env:
        # main.py cria o engine do banco (container.database()) na importação
        # do módulo — não conecta de fato, só precisa de uma URL sintaticamente
        # válida para não levantar RuntimeError aqui.
        DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
        ENCRYPTION_KEY: MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI9
        JWT_SECRET: ci-import-check-secret
      run: |
        # Tenta importar o módulo principal para verificar se há erros
        python -c "import sys; sys.path.insert(0, '.'); import main; print('✓ Import successful')"

    - name: Check for common issues
      run: |
        # Verifica complexidade e outros problemas (não bloqueia)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=venv,__pycache__,.git

    - name: Build summary
      if: success()
      run: |
        echo "✅ Build completed successfully!"
        echo "- Python version: ${{ matrix.python-version }}"
        echo "- Branch: ${{ github.ref_name }}"
        echo "- Commit: ${{ github.sha }}"
