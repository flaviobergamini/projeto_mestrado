# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - mestrado-unifei

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 🛠️ Local Build Section (Optional)
      # The following section in your workflow is designed to catch build issues early on the client side, before deployment. This can be helpful for debugging and validation. However, if this step significantly increases deployment time and early detection is not critical for your workflow, you may remove this section to streamline the deployment process.
      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt
                
      # By default, when you enable GitHub CI/CD integration through the Azure portal, the platform automatically sets the SCM_DO_BUILD_DURING_DEPLOYMENT application setting to true. This triggers the use of Oryx, a build engine that handles application compilation and dependency installation (e.g., pip install) directly on the platform during deployment. Hence, we exclude the antenv virtual environment directory from the deployment artifact to reduce the payload size.

      - name: Clean unnecessary files to reduce artifact size
        run: |
          # Remove arquivos desnecessários para reduzir drasticamente o tamanho
          rm -rf .git .github .vscode __pycache__ .pytest_cache alembic
          find . -type d -name "__pycache__" -exec rm -rf {} + || true
          find . -type f -name "*.pyc" -delete || true
          find . -type f -name "*.pyo" -delete || true
          find . -type f -name "*.log" -delete || true
          rm -f requirements.txt.backup || true

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/
            !.git/
            !.github/
            !.vscode/
            !__pycache__/
            !*.pyc
            !*.pyo
            !*.log
            !.env
            !.env.*
            !alembic/
            !requirements.txt.backup

      # 🚫 Opting Out of Oryx Build
      # If you prefer to disable the Oryx build process during deployment, follow these steps:
      # 1. Remove the SCM_DO_BUILD_DURING_DEPLOYMENT app setting from your Azure App Service Environment variables.
      # 2. Refer to sample workflows for alternative deployment strategies: https://github.com/Azure/actions-workflow-samples/tree/master/AppService
      

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0C3D68968A824847B39A20516318616B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D41D07E865FB4A05BD84B6D2307A4725 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_765FAC8CDB6A4CBD8078642EA0C4074D }}

      - name: Prepare for deployment
        run: |
          echo "🔍 Descobrindo o Resource Group..."
          RESOURCE_GROUP=$(az resource list --name mestrado-unifei --resource-type "Microsoft.Web/sites" --query "[0].resourceGroup" -o tsv)

          if [ -z "$RESOURCE_GROUP" ]; then
            echo "❌ Erro: Não foi possível encontrar o Resource Group"
            exit 1
          fi

          echo "📦 Resource Group encontrado: $RESOURCE_GROUP"

          # Apenas reinicia para limpar processos - o deploy com --clean vai limpar arquivos
          echo "🔄 Reiniciando App Service para limpar processos..."
          az webapp restart --name mestrado-unifei --resource-group $RESOURCE_GROUP

          echo "⏳ Aguardando 15 segundos para estabilizar..."
          sleep 15

          echo "✅ Pronto para deploy!"
        continue-on-error: false

      - name: Create ZIP package
        run: |
          echo "📦 Criando pacote ZIP..."
          # Remove arquivos que já foram limpos antes
          ls -la

          # Cria ZIP incluindo todos os arquivos necessários
          zip -r app.zip . -x "*.git*" "*.github*" "*__pycache__*" "*.pyc" "*.pyo" "*antenv*"

          echo "📊 Tamanho do pacote:"
          ls -lh app.zip
          du -sh app.zip
          echo "✅ Pacote criado!"

      - name: Get publish profile
        id: publishprofile
        run: |
          echo "🔑 Obtendo credenciais de deploy..."
          RESOURCE_GROUP=$(az resource list --name mestrado-unifei --resource-type "Microsoft.Web/sites" --query "[0].resourceGroup" -o tsv)

          # Obtém as credenciais de publicação
          PUBLISH_PROFILE=$(az webapp deployment list-publishing-profiles --name mestrado-unifei --resource-group $RESOURCE_GROUP --xml)

          # Extrai username e password do XML
          USERNAME=$(echo "$PUBLISH_PROFILE" | grep -oP '(?<=userName=")[^"]*' | head -1)
          PASSWORD=$(echo "$PUBLISH_PROFILE" | grep -oP '(?<=userPWD=")[^"]*' | head -1)

          echo "::add-mask::$PASSWORD"
          echo "username=$USERNAME" >> $GITHUB_OUTPUT
          echo "password=$PASSWORD" >> $GITHUB_OUTPUT
          echo "✅ Credenciais obtidas!"

      - name: 'Deploy to Azure Web App via Kudu API'
        run: |
          echo "🚀 Fazendo deploy via Kudu API..."

          # Deploy usando a API Kudu zipdeploy
          curl -X POST \
            -u "${{ steps.publishprofile.outputs.username }}:${{ steps.publishprofile.outputs.password }}" \
            --data-binary @app.zip \
            -H "Content-Type: application/zip" \
            https://mestrado-unifei-fzg4awcvb6cxb3eb.scm.azurewebsites.net/api/zipdeploy

          echo ""
          echo "✅ Deploy concluído!"

          # Aguarda um pouco para o deploy processar
          echo "⏳ Aguardando processamento..."
          sleep 20

      - name: Verify deployment
        run: |
          echo "🔍 Verificando status do deployment..."
          RESOURCE_GROUP=$(az resource list --name mestrado-unifei --resource-type "Microsoft.Web/sites" --query "[0].resourceGroup" -o tsv)

          STATUS=$(az webapp show --name mestrado-unifei --resource-group $RESOURCE_GROUP --query state -o tsv)
          echo "📊 Status do App Service: $STATUS"

          echo "✅ Deployment finalizado!"
          echo "🌐 URL: https://mestrado-unifei-fzg4awcvb6cxb3eb.brazilsouth-01.azurewebsites.net"
          echo ""
          echo "⚠️ Nota: O Oryx vai instalar as dependências na primeira requisição."
          echo "Aguarde 2-3 minutos antes de acessar a aplicação."
        continue-on-error: false