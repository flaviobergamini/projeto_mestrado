# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - mestrado

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # -------------------
  # Build phase
  # -------------------
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate requirements.txt
        run: |
          if [ ! -f "requirements.txt" ]; then
            echo "❌ requirements.txt não encontrado!"
            exit 1
          fi
          echo "✅ requirements.txt encontrado."

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: .

  # -------------------
  # Deploy phase
  # -------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_89B9F4E9880146779E71704F33F30136 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7A10B629EA8D45CE912722D9681C31BF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DEF383FF965E4B589B2866D53C32DB3F }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'mestrado'
          slot-name: 'Production'

          


