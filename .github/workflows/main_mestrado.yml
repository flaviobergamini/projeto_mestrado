# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - mestrado

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Dependências instaladas AQUI (no GitHub) e publicadas junto com o código.
      # O build do Azure (Oryx) deixou de rodar a partir de 16/09 e o app ficou preso num pacote antigo,
      # então o deploy não depende mais dele. A pasta NÃO pode começar com ponto: o upload-artifact@v4
      # ignora arquivos/pastas ocultos por padrão.
      - name: Install dependencies into pylibs/ (shipped with the app)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=pylibs --no-cache-dir

      - name: Verify the packaged app imports (with the packaged dependencies only)
        env:
          PYTHONPATH: ${{ github.workspace }}/pylibs
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
          ENCRYPTION_KEY: MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI9
          JWT_SECRET: ci-import-check-secret
        run: |
          python -c "import sys; sys.path.insert(0, '.'); import main; print('import ok:', len(main.app.routes), 'routes')"

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/
            !.git/
            !tests/
            !docs/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6324CFAE55904B398EFFB3D42C116874 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EE8DA471FD5548CC918A718E8B71A3DE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A904A91E6EB84ADA8881FB55C090BF61 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'mestrado'
          slot-name: 'Production'